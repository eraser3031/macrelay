[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "macrelay"
version = "0.1.0"
description = "Run local coding agents on one Mac, control them from another over SSH."
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = []

[project.urls]
Repository = "https://github.com/eraser3031/macrelay"

[project.scripts]
macrelay = "macrelay.cli:main"

[tool.setuptools]
packages = ["macrelay"]
